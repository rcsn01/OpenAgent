id = "openagent"
name = "OpenAgent"
description = "A personal AI coding agent."
version = "1.14.31"
schema_version = 1
authors = ["rcsn01"]
repository = "https://github.com/rcsn01/OpenAgent"

[agent_servers.openagent]
name = "OpenAgent"
icon = "./icons/opencode.svg"

[agent_servers.openagent.targets.darwin-aarch64]
archive = "https://github.com/rcsn01/OpenAgent/releases/download/v1.14.31/openagent-darwin-arm64.zip"
cmd = "./openagent"
args = ["acp"]

[agent_servers.openagent.targets.darwin-x86_64]
archive = "https://github.com/rcsn01/OpenAgent/releases/download/v1.14.31/openagent-darwin-x64.zip"
cmd = "./openagent"
args = ["acp"]

[agent_servers.openagent.targets.linux-aarch64]
archive = "https://github.com/rcsn01/OpenAgent/releases/download/v1.14.31/openagent-linux-arm64.tar.gz"
cmd = "./openagent"
args = ["acp"]

[agent_servers.openagent.targets.linux-x86_64]
archive = "https://github.com/rcsn01/OpenAgent/releases/download/v1.14.31/openagent-linux-x64.tar.gz"
cmd = "./openagent"
args = ["acp"]

[agent_servers.openagent.targets.windows-x86_64]
archive = "https://github.com/rcsn01/OpenAgent/releases/download/v1.14.31/openagent-windows-x64.zip"
cmd = "./openagent.exe"
args = ["acp"]
